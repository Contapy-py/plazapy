  <meta charset="UTF-8" />

  <title>Inmuebles y vehículos en Paraguay — Alquiler y venta | PlazaPY</title>
  <meta name="description" content="Encontrá casas, departamentos, terrenos, autos y motos en alquiler o venta en Paraguay. Publicá tu anuncio en PlazaPY." />

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.6rem 0 1.2rem}
.migas{font-size:.78rem;color:var(--gris);margin-bottom:.6rem}
.migas a{text-decoration:none}.migas a:hover{color:var(--azul)}
.cabecera h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.cabecera p{color:var(--gris);font-size:.92rem;margin-top:.2rem}
.panel{background:#fff;border-radius:var(--r-xl);padding:1.2rem 1.4rem;margin-bottom:1.2rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{border:none;background:var(--azul-fondo);color:#344054;font-size:.9rem;font-weight:700;padding:.65rem 1.3rem;border-radius:100px;cursor:pointer}
.tab:hover{background:var(--azul-suave);color:var(--azul)}
.tab.ok{background:var(--azul);color:#fff}
.sub{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.9rem}
.sub:empty{display:none}
.chip{border:1.5px solid var(--borde);background:#fff;border-radius:100px;padding:.42rem .95rem;font-size:.8rem;font-weight:600;cursor:pointer;color:#344054}
.chip:hover{border-color:var(--azul);color:var(--azul)}
.chip.ok{background:var(--azul-suave);border-color:var(--azul);color:var(--azul)}
.filtros{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:.7rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--borde)}
.filtros label{display:block;font-size:.72rem;font-weight:700;color:var(--gris);margin-bottom:.25rem}
.filtros select,.filtros input{width:100%;padding:.65rem .8rem;border:1.5px solid var(--borde);border-radius:var(--r-md);font-size:.86rem;background:#fff;outline:none;color:var(--tinta);font-family:inherit}
.filtros select:focus,.filtros input:focus{border-color:var(--azul)}
.filtros input::-webkit-outer-spin-button,.filtros input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.filtros input[type=number]{-moz-appearance:textfield}
.fila{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.resultados{font-size:.84rem;color:var(--gris)}
.resultados strong{color:var(--tinta)}
.limpiar{border:none;background:none;color:var(--azul);font-weight:700;font-size:.82rem;cursor:pointer}
.mas{display:flex;justify-content:center;margin-top:1.75rem}
@media(max-width:768px){
  .cabecera h1{font-size:1.5rem}
  .panel{padding:1rem;border-radius:var(--r-lg)}
  .filtros{grid-template-columns:1fr 1fr}
  .tab{padding:.55rem 1rem;font-size:.84rem}
}
  </style>
</head>
<body>
<header id="pz-nav" data-activo="anuncios" data-buscar="anuncios.html" data-placeholder="Buscar inmuebles y vehículos"></header>

<main class="pz-container">
  <div class="cabecera">
    <div>
      <div class="migas"><a href="index.html">Inicio</a> / <b>Inmuebles y vehículos</b></div>
      <h1>Inmuebles y vehículos</h1>
      <p>Alquiler y venta de casas, departamentos, terrenos, autos y motos en todo Paraguay.</p>
    </div>
    <a class="btn btn-primary" href="publicar.html">Publicar anuncio</a>
  </div>

  <div class="panel">
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab ok" data-t="">Todo</button>
      <button class="tab" data-t="inmuebles">🏠 Inmuebles</button>
      <button class="tab" data-t="vehiculos">🚗 Vehículos</button>
    </div>
    <div class="sub" id="sub"></div>
    <div class="filtros">
      <div><label for="fCiudad">Ciudad</label><select id="fCiudad"><option value="">Todas</option></select></div>
      <div><label for="fMin">Precio mínimo (Gs.)</label><input type="number" id="fMin" min="0" placeholder="0"/></div>
      <div><label for="fMax">Precio máximo (Gs.)</label><input type="number" id="fMax" min="0" placeholder="Sin tope"/></div>
      <div><label for="fOrden">Ordenar por</label>
        <select id="fOrden"><option value="dest">Destacados primero</option><option value="nuevos">Más recientes</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select>
      </div>
    </div>
  </div>

  <div class="fila"><div class="resultados" id="countTxt">Cargando...</div><button class="limpiar" id="btnLimpiar" style="display:none">Limpiar filtros</button></div>
  <div class="agrid" id="grid"><div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div></div>
  <div class="mas" id="masBox"></div>
</main>

<footer id="pz-footer"></footer>
<script src="plazapy.js"></script>
<script>
const SUPA_URL='https://ayjlnbxcojqglcufqzob.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5amxuYnhjb2pxZ2xjdWZxem9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjE3MzcsImV4cCI6MjA5NTgzNzczN30.K3IF9CDiINmZ-rN3x40Z7eAivJFtMHRJHHlOnw7MUCY';
const db=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const {esc,gs}=PZ;
const POR_PAG=12;
let todos=[],filtrados=[],visibles=POR_PAG;
const f={tab:'',sub:'',q:''};

const SUBS={
  inmuebles:[['','Todos'],['alquiler','Alquiler'],['venta','Venta']],
  vehiculos:[['','Todos'],['autos','Autos'],['motos','Motos']]
};

async function cargar(){
  const{data,error}=await db.from('anuncios').select('*').eq('estado','aprobado')
    .in('categoria',['inmuebles','autos','motos']).order('created_at',{ascending:false});
  if(error){document.getElementById('grid').innerHTML='<div class="vacio">No pudimos cargar los anuncios. Actualizá la página para intentar de nuevo.</div>';document.getElementById('countTxt').textContent='';return;}
  todos=data||[];

  const ciudades=[...new Set(todos.map(a=>a.ciudad).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  document.getElementById('fCiudad').innerHTML='<option value="">Todas</option>'+ciudades.map(c=>`<option>${esc(c)}</option>`).join('');

  // Parámetros de la URL: tipo=inmuebles|autos|motos|vehiculos, op=alquiler|venta, q=texto
  const p=new URLSearchParams(location.search);
  const tipo=p.get('tipo')||'';
  if(tipo==='autos'||tipo==='motos'){f.tab='vehiculos';f.sub=tipo;}
  else if(tipo==='inmuebles'||tipo==='vehiculos'){f.tab=tipo;}
  if(f.tab==='inmuebles'&&(p.get('op')==='alquiler'||p.get('op')==='venta'))f.sub=p.get('op');
  if(p.get('q')){f.q=p.get('q');document.getElementById('searchInput').value=f.q;}
  pintarTabs();
  aplicar();
}

function pintarTabs(){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('ok',b.dataset.t===f.tab));
  const subs=SUBS[f.tab]||[];
  document.getElementById('sub').innerHTML=subs.map(([v,n])=>`<button class="chip${v===f.sub?' ok':''}" data-s="${v}">${n}</button>`).join('');
  document.querySelectorAll('#sub .chip').forEach(b=>b.onclick=()=>{f.sub=b.dataset.s;pintarTabs();aplicar();});
}
document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{f.tab=b.dataset.t;f.sub='';pintarTabs();aplicar();});
['fCiudad','fOrden'].forEach(id=>document.getElementById(id).onchange=()=>aplicar());
['fMin','fMax'].forEach(id=>document.getElementById(id).onchange=()=>aplicar());
document.getElementById('btnLimpiar').onclick=()=>{
  f.tab='';f.sub='';f.q='';
  document.getElementById('searchInput').value='';
  document.getElementById('fCiudad').value='';document.getElementById('fMin').value='';document.getElementById('fMax').value='';
  document.getElementById('fOrden').value='dest';
  pintarTabs();aplicar();
};
window.PZ_ONSEARCH=q=>{f.q=q;aplicar();};

function aplicar(){
  const ciudad=document.getElementById('fCiudad').value;
  const min=Number(document.getElementById('fMin').value)||0;
  const max=Number(document.getElementById('fMax').value)||Infinity;
  const orden=document.getElementById('fOrden').value;
  const q=(f.q||'').toLowerCase().trim();

  filtrados=todos.filter(a=>{
    if(f.tab==='inmuebles'&&a.categoria!=='inmuebles')return false;
    if(f.tab==='vehiculos'&&a.categoria==='inmuebles')return false;
    if(f.tab==='inmuebles'&&f.sub){if(PZ.operacion(a).toLowerCase()!==f.sub)return false;}
    if(f.tab==='vehiculos'&&f.sub&&a.categoria!==f.sub)return false;
    if(ciudad&&a.ciudad!==ciudad)return false;
    if(Number(a.precio)<min||Number(a.precio)>max)return false;
    if(q&&!((a.titulo||'').toLowerCase().includes(q)||(a.descripcion||'').toLowerCase().includes(q)||(a.barrio||'').toLowerCase().includes(q)||(a.ciudad||'').toLowerCase().includes(q)))return false;
    return true;
  });
  if(orden==='asc')filtrados.sort((a,b)=>a.precio-b.precio);
  else if(orden==='desc')filtrados.sort((a,b)=>b.precio-a.precio);
  else if(orden==='nuevos')filtrados.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  else filtrados.sort((a,b)=>(b.destacado?1:0)-(a.destacado?1:0)||new Date(b.created_at)-new Date(a.created_at));

  const hayFiltros=f.tab||f.sub||q||ciudad||min||max!==Infinity;
  document.getElementById('btnLimpiar').style.display=hayFiltros?'inline-block':'none';
  visibles=POR_PAG;
  render();
}

function render(){
  const total=filtrados.length;
  document.getElementById('countTxt').innerHTML=`<strong>${total}</strong> anuncio${total!==1?'s':''}`;
  const box=document.getElementById('masBox');
  if(!total){
    document.getElementById('grid').innerHTML=`<div class="vacio"><strong>No encontramos anuncios con esos filtros</strong><br>Probá con otros filtros o <a href="publicar.html">publicá el tuyo →</a></div>`;
    box.innerHTML='';return;
  }
  document.getElementById('grid').innerHTML=filtrados.slice(0,visibles).map(PZ.cardAnuncio).join('');
  const faltan=total-visibles;
  box.innerHTML=faltan>0?`<button class="btn btn-outline" onclick="verMas()">Ver ${Math.min(faltan,POR_PAG)} más</button>`:'';
}
function verMas(){visibles+=POR_PAG;render();}

document.addEventListener('DOMContentLoaded',cargar);
</script>
</body>
</html>
