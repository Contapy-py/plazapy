<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1VML3DMJ80"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-1VML3DMJ80');
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tienda — PlazaPY</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#1558D6"/>
<link rel="icon" href="/icon-192.png"/>
<link rel="stylesheet" href="plazapy.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
.estado-pagina{text-align:center;padding:4rem 1rem;color:var(--gris)}
.estado-pagina a{color:var(--azul);font-weight:700}
.portada{height:200px;border-radius:0 0 var(--r-xl) var(--r-xl);background:linear-gradient(120deg,#0E41A8,#1558D6 55%,#4F8DF5);overflow:hidden}
.portada img{width:100%;height:100%;object-fit:cover;display:block}
.cabecera-t{position:relative;margin-top:-52px;background:#fff;border-radius:var(--r-xl);border:1px solid var(--borde);padding:1.4rem 1.6rem;display:flex;gap:1.3rem;align-items:center;box-shadow:var(--sombra)}
.logo-big{width:92px;height:92px;border-radius:22px;background:var(--azul-suave);color:var(--azul);border:4px solid #fff;display:grid;place-items:center;font-weight:800;font-size:2.2rem;overflow:hidden;flex-shrink:0;margin-top:-46px;box-shadow:0 4px 14px rgba(16,24,40,.12)}
.logo-big img{width:100%;height:100%;object-fit:cover}
.info-t{flex:1;min-width:0}
.nombre-t{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.desc-t{font-size:.9rem;color:var(--gris);margin:.25rem 0 .55rem;max-width:620px}
.meta-t{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.82rem;color:#344054;font-weight:600}
.acciones-t{display:flex;gap:.6rem;flex-shrink:0}
.tabs{display:flex;gap:.4rem;margin:1.6rem 0 1.2rem;border-bottom:1px solid var(--borde)}
.tab{padding:.7rem 1.1rem;font-size:.9rem;font-weight:700;color:var(--gris);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--azul)}
.tab.activo{color:var(--azul);border-bottom-color:var(--azul)}
.seccion-t{display:none}.seccion-t.v{display:block}
.info-panel{background:#fff;border:1px solid var(--borde);border-radius:var(--r-lg);overflow:hidden;margin-bottom:1rem;max-width:720px}
.info-row{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 1.2rem;font-size:.88rem;border-bottom:1px solid var(--borde)}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--gris);font-weight:600}
.info-row span:last-child{font-weight:700;text-align:right;word-break:break-word}
#mapaTiendaPublic{height:300px}
@media(max-width:768px){
  .portada{height:140px;border-radius:0 0 var(--r-lg) var(--r-lg)}
  .cabecera-t{flex-direction:column;align-items:flex-start;padding:1.2rem;gap:.9rem;margin-top:-40px}
  .logo-big{width:76px;height:76px;margin-top:-52px;font-size:1.8rem}
  .nombre-t{font-size:1.3rem}
  .acciones-t{width:100%}
  .acciones-t .btn{flex:1}
}
</style>
</head>
<body>
<header id="pz-nav" data-activo="tiendas" data-placeholder="Buscar productos"></header>

<div id="loadingPage" class="estado-pagina">Cargando tienda...</div>
<div id="errorPage" class="estado-pagina" style="display:none">No encontramos esta tienda.<br><a href="tiendas.html">Ver todas las tiendas →</a></div>

<div id="pageContent" style="display:none">
  <div class="pz-container" style="padding-top:0">
    <div class="portada" id="bannerTienda"></div>
    <div class="cabecera-t">
      <div class="logo-big" id="logoTienda">🏪</div>
      <div class="info-t">
        <h1 class="nombre-t" id="nombreTienda"></h1>
        <div class="desc-t" id="descTienda"></div>
        <div class="meta-t"><span id="metaCiudad">📍 —</span><span id="metaProductos">📦 0 productos</span></div>
      </div>
      <div class="acciones-t">
        <a href="#" class="btn btn-wa" id="btnContactarTienda" target="_blank" rel="noopener">Contactar</a>
        <a href="#" class="btn btn-outline" id="btnVerMapa" onclick="event.preventDefault();toggleMapa()">Ver ubicación</a>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <div class="tab activo" role="tab" onclick="verTab('productos',this)">Productos</div>
      <div class="tab" role="tab" onclick="verTab('info',this)">Información</div>
    </div>

    <div class="seccion-t v" id="secProductosT"><div class="pgrid" id="gridProductosTienda"><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div></div></div>
    <div class="seccion-t" id="secInfoT">
      <div class="info-panel">
        <div class="info-row"><span class="info-label">Dirección</span><span id="infoDireccion">—</span></div>
        <div class="info-row"><span class="info-label">Ciudad</span><span id="infoCiudad">—</span></div>
        <div class="info-row"><span class="info-label">WhatsApp</span><span id="infoWa">—</span></div>
        <div class="info-row"><span class="info-label">Instagram</span><span id="infoInsta">—</span></div>
        <div class="info-row"><span class="info-label">Miembro desde</span><span id="infoFecha">—</span></div>
      </div>
      <div class="info-panel" id="mapaPanel" style="display:none"><div id="mapaTiendaPublic"></div></div>
    </div>
  </div>
</div>

<footer id="pz-footer"></footer>
<script src="plazapy.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPA_URL='https://ayjlnbxcojqglcufqzob.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5amxuYnhjb2pxZ2xjdWZxem9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjE3MzcsImV4cCI6MjA5NTgzNzczN30.K3IF9CDiINmZ-rN3x40Z7eAivJFtMHRJHHlOnw7MUCY';
const db=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const {esc,gs,ICONOS}=PZ;
let tiendaData=null,mapaT=null;

async function cargar(){
  const id=new URLSearchParams(window.location.search).get('id');
  if(!id){mostrarError();return;}
  const{data,error}=await db.from('tiendas').select('*').eq('id',id).eq('estado','activa').single();
  if(error||!data){mostrarError();return;}
  tiendaData=data;
  document.title=data.nombre+' — PlazaPY';
  document.getElementById('bannerTienda').innerHTML=data.banner_url?`<img src="${esc(data.banner_url)}" alt=""/>`:'';
  document.getElementById('logoTienda').innerHTML=data.logo_url?`<img src="${esc(data.logo_url)}" alt="${esc(data.nombre)}"/>`:esc((data.nombre||'?')[0].toUpperCase());
  document.getElementById('nombreTienda').textContent=data.nombre;
  document.getElementById('descTienda').textContent=data.descripcion||'';
  document.getElementById('metaCiudad').textContent='📍 '+(data.ciudad||'Paraguay');
  const wa=(data.whatsapp||'').replace(/\D/g,'');
  document.getElementById('btnContactarTienda').href=`https://wa.me/${wa}?text=${encodeURIComponent('Hola! Vi tu tienda '+data.nombre+' en PlazaPY.')}`;
  document.getElementById('infoDireccion').textContent=data.direccion||'—';
  document.getElementById('infoCiudad').textContent=(data.ciudad||'—')+(data.barrio?' · '+data.barrio:'');
  document.getElementById('infoWa').textContent=data.whatsapp||'—';
  document.getElementById('infoInsta').textContent=data.instagram||'—';
  document.getElementById('infoFecha').textContent=new Date(data.created_at).toLocaleDateString('es-PY',{month:'long',year:'numeric'});

  const{data:productos}=await db.from('productos').select('*').eq('tienda_id',id).eq('estado','aprobado').eq('disponible',true).order('created_at',{ascending:false});
  const ps=productos||[];
  document.getElementById('metaProductos').textContent='📦 '+ps.length+' producto'+(ps.length!==1?'s':'');
  const grid=document.getElementById('gridProductosTienda');
  grid.innerHTML=ps.length?ps.map(p=>{
    const precio=p.precio_oferta||p.precio;
    const desc=p.precio_oferta&&p.precio>0?Math.round((1-p.precio_oferta/p.precio)*100):0;
    const img=p.foto_url?`<img src="${esc(p.foto_url)}" alt="${esc(p.nombre)}" loading="lazy"/>`:`<span class="ico">${ICONOS[p.categoria]||'📦'}</span>`;
    const ins=p.precio_oferta?`<span class="insignia oferta">${desc>0?'-'+desc+'%':'Oferta'}</span>`:'';
    return `<a href="producto.html?id=${encodeURIComponent(p.id)}" class="pcard">
      <div class="pcard-img">${img}${ins}</div>
      <div class="pcard-nombre">${esc(p.nombre)}</div>
      <div><span class="pcard-precio">${gs(precio)}</span>${p.precio_oferta?`<span class="pcard-orig">${gs(p.precio)}</span>`:''}</div>
    </a>`;
  }).join(''):'<div class="vacio">Esta tienda todavía no tiene productos publicados.</div>';

  document.getElementById('loadingPage').style.display='none';
  document.getElementById('pageContent').style.display='block';
}
function verTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('activo'));
  document.querySelectorAll('.seccion-t').forEach(s=>s.classList.remove('v'));
  el.classList.add('activo');
  document.getElementById('sec'+tab.charAt(0).toUpperCase()+tab.slice(1)+'T').classList.add('v');
}
function toggleMapa(){
  verTab('info',document.querySelectorAll('.tab')[1]);
  if(tiendaData.lat&&tiendaData.lng){
    document.getElementById('mapaPanel').style.display='block';
    setTimeout(()=>{
      if(!mapaT){
        mapaT=L.map('mapaTiendaPublic').setView([tiendaData.lat,tiendaData.lng],15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mapaT);
        L.marker([tiendaData.lat,tiendaData.lng]).addTo(mapaT);
      } else mapaT.invalidateSize();
    },100);
  } else PZ.toast('Esta tienda no marcó su ubicación en el mapa');
}
function mostrarError(){
  document.getElementById('loadingPage').style.display='none';
  document.getElementById('errorPage').style.display='block';
}
cargar();
</script>
</body>
</html>
