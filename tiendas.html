<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tiendas — PlazaPY</title>
<meta name="description" content="Descubrí tiendas locales paraguayas en PlazaPY."/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#1558D6"/>
<link rel="icon" href="/icon-192.png"/>
<link rel="stylesheet" href="plazapy.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.cabecera{padding:1.6rem 0 1.2rem}
.migas{font-size:.78rem;color:var(--gris);margin-bottom:.6rem}
.migas a{text-decoration:none}.migas a:hover{color:var(--azul)}
.cabecera h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.cabecera p{color:var(--gris);font-size:.92rem;margin-top:.2rem}
.barra{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.resultados{font-size:.84rem;color:var(--gris)}
.resultados strong{color:var(--tinta)}
.ciudades{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{border:1.5px solid var(--borde);background:#fff;border-radius:100px;padding:.42rem .95rem;font-size:.8rem;font-weight:600;cursor:pointer;color:#344054}
.chip:hover{border-color:var(--azul);color:var(--azul)}
.chip.ok{background:var(--azul);border-color:var(--azul);color:#fff}
</style>
</head>
<body>
<header id="pz-nav" data-activo="tiendas" data-placeholder="Buscar tiendas"></header>

<main class="pz-container">
  <div class="cabecera">
    <div class="migas"><a href="index.html">Inicio</a> / <b>Tiendas</b></div>
    <h1>Tiendas en PlazaPY</h1>
    <p>Descubrí negocios locales paraguayos y comprá con delivery a tu puerta.</p>
  </div>
  <div class="barra">
    <div class="resultados" id="countTxt">Cargando...</div>
    <div class="ciudades" id="ciudades"></div>
  </div>
  <div class="sgrid" id="grid"><div class="skel" style="height:190px"></div><div class="skel" style="height:190px"></div><div class="skel" style="height:190px"></div></div>
</main>

<footer id="pz-footer"></footer>
<script src="plazapy.js"></script>
<script>
const SUPA_URL='https://ayjlnbxcojqglcufqzob.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5amxuYnhjb2pxZ2xjdWZxem9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjE3MzcsImV4cCI6MjA5NTgzNzczN30.K3IF9CDiINmZ-rN3x40Z7eAivJFtMHRJHHlOnw7MUCY';
const db=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const {esc}=PZ;
let todas=[],ciudadSel='';

async function cargar(){
  const{data,error}=await db.from('tiendas').select('*').eq('estado','activa').order('destacada',{ascending:false}).order('created_at',{ascending:false});
  if(error){document.getElementById('grid').innerHTML='<div class="vacio">No pudimos cargar las tiendas. Actualizá la página para intentar de nuevo.</div>';document.getElementById('countTxt').textContent='';return;}
  todas=data||[];
  // Si el destacado ya venció, no lo mostramos como destacado ni lo ordenamos primero
  const ahora=new Date();
  todas.forEach(t=>{if(t.destacada_hasta&&new Date(t.destacada_hasta)<ahora)t.destacada=false;});
  todas.sort((a,b)=>(b.destacada?1:0)-(a.destacada?1:0));

  const ciudades=[...new Set(todas.map(t=>t.ciudad).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  document.getElementById('ciudades').innerHTML=ciudades.length>1?
    `<button class="chip ok" data-c="">Todas</button>`+ciudades.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join(''):'';
  document.querySelectorAll('#ciudades .chip').forEach(b=>b.onclick=()=>{
    ciudadSel=b.dataset.c;
    document.querySelectorAll('#ciudades .chip').forEach(x=>x.classList.toggle('ok',x===b));
    filtrar();
  });
  const q=new URLSearchParams(location.search).get('q');
  if(q)document.getElementById('searchInput').value=q;
  filtrar();
}

function filtrar(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  render(todas.filter(t=>
    (!ciudadSel||t.ciudad===ciudadSel)&&
    (!q||(t.nombre||'').toLowerCase().includes(q)||(t.descripcion||'').toLowerCase().includes(q))
  ));
}

function render(lista){
  document.getElementById('countTxt').innerHTML=`<strong>${lista.length}</strong> tienda${lista.length!==1?'s':''}`;
  if(!lista.length){
    document.getElementById('grid').innerHTML=`<div class="vacio"><strong>No encontramos tiendas</strong><br><a href="vender.html">Abrí la tuya gratis →</a></div>`;
    return;
  }
  document.getElementById('grid').innerHTML=lista.map(t=>{
    const banner=t.banner_url?` style="background-image:url('${esc(t.banner_url)}')"`:'';
    const logo=t.logo_url?`<img src="${esc(t.logo_url)}" alt="${esc(t.nombre)}"/>`:esc((t.nombre||'?')[0].toUpperCase());
    return `<a href="tienda.html?id=${encodeURIComponent(t.id)}" class="scard">
      <div class="scard-banner"${banner}><div class="scard-logo">${logo}</div></div>
      <div class="scard-body">
        ${t.destacada?'<span class="pill-dest">★ Destacada</span>':''}
        <div class="scard-nombre">${esc(t.nombre)}</div>
        <div class="scard-desc">${esc(t.descripcion||'Tienda en PlazaPY')}</div>
        <div class="scard-meta">📍 ${esc(t.ciudad||'Paraguay')}</div>
      </div>
    </a>`;
  }).join('');
}

window.PZ_ONSEARCH=()=>filtrar();
document.addEventListener('DOMContentLoaded',cargar);
</script>
</body>
</html>
